<div class="view view-login">
  <h2>Iniciar Sesión</h2>

  <form id="form-login">
    <input id="login-user" type="text" placeholder="Usuario" required />
    <input id="login-pass" type="password" placeholder="Contraseña" required />

    <button type="submit">Ingresar</button>
  </form>

  <div class="links">
    <button id="to-register">Crear cuenta</button>
    <button id="to-recover">Recuperar contraseña</button>
  </div>
</div>
