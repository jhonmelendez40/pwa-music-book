<section class="view">
  <h1>Iniciar sesión</h1>
  <form id="form-login">
    <input id="login-user" placeholder="Usuario" required />
    <input id="login-pass" type="password" placeholder="Contraseña" required />
    <button type="submit">Entrar</button>
  </form>
  <button id="to-register">Registro</button>
  <button id="to-recover">Recuperar contraseña</button>
</section>
