<div class="view view-main">

  <header>
    <h2>Mis Canciones</h2>
    <button id="logout-btn">Cerrar Sesión</button>
  </header>

  <div class="controls">
    <button id="add-song-btn">Agregar Canción</button>
    <button id="order-song-btn">Ordenar</button>
  </div>

  <ul id="song-list" class="song-list"></ul>

  <!-- MODAL AGREGAR -->
  <div class="modal hidden" id="modal-add-song">
    <div class="modal-box">
      <h3>Nueva Canción</h3>

      <input id="song-title" type="text" placeholder="Título" />
      <textarea id="song-lyrics" placeholder="Letra..."></textarea>

      <button id="save-song-btn">Guardar</button>
      <button id="close-add-song">Cerrar</button>
    </div>
  </div>

  <!-- MODAL LECTOR -->
  <div class="modal hidden" id="modal-reader">
    <div class="modal-box reader">
      <h3 id="reader-title"></h3>

      <pre id="reader-text"></pre>

      <div class="reader-controls">
        <button id="prev-page">Anterior</button>
        <button id="next-page">Siguiente</button>
      </div>

      <button id="close-reader">Cerrar</button>
    </div>
  </div>

  <!-- MODAL ORDENAR -->
  <div class="modal hidden" id="modal-order">
    <div class="modal-box">
      <h3>Ordenar Canciones</h3>

      <ul id="order-list"></ul>

      <button id="save-order-btn">Guardar Orden</button>
      <button id="close-order">Cerrar</button>
    </div>
  </div>

</div>
